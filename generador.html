    function generarFecha(){
        var hoy = new Date(2026, 7, 1);
        var fMax = new Date(hoy); fMax.setFullYear(2009);
        var fMin = new Date(hoy); fMin.setFullYear(1961);
        var f = new Date(fMin.getTime() + Math.random() * (fMax.getTime() - fMin.getTime()));
        return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`;
    }
        var salida = '';
        
    function generar(){
        salida = 'INSERT INTO alumnos VALUES \n'
        let cantidad = parseInt(document.getElementById("cantidad").value);


        if (cantidad < 1 || cantidad > 50001) {
            alert("La cantidad debe estar entre 1 y 50001");
            return;
        }

        for (let i = 0; i < cantidad; i++) {
        
            var esUltimo = (i === cantidad - 1);
            var terminador = esUltimo ? ';' : ',';
            
            salida += `(${23311200+i},'${apellidosAlemanes[Math.floor(Math.random() * 100)]}','${apellidosEspanoles[Math.floor(Math.random() * 100)]}','${nombresChinos[Math.floor(Math.random() * 100)]}','${generarFecha()}','${23311200+i+"@unikino.edu.mx"}')${terminador}\n`;
        }
        document.getElementById("resultado").innerHTML=salida;
    }

    function guardar(){

        elemento = document.createElement("a");
        elemento.setAttribute("href","data:text/plain;charset=utf-8,"+encodeURIComponent(salida));
        elemento.setAttribute("download","alumnos.sql");
        elemento.style.display="none"
        document.body.appendChild(elemento);
        elemento.click();
        document.body.removeChild(elemento);

    }

function cambiar() {
            const formato = document.getElementById("formato").value;
            if (formato === "SQL") {
                document.getElementById("guardar").value = "GUARDAR SQL";
                document.getElementById("generar").value = "GENERAR ALUMNOS";
            } else if (formato === "CSV") {
                document.getElementById("guardar").value = "GUARDAR CSV";
                document.getElementById("generar").value = "GENERAR CSV";
            } else if (formato === "JSON") {
                document.getElementById("guardar").value = "GUARDAR JSON";
                document.getElementById("generar").value = "GENERAR JSON";
            }
        }

function generarFormato() {
            const formato = document.getElementById("formato").value;
            if (formato === "SQL") {
                generar();
            } else if (formato === "CSV") {
                generarCSV();
            } else if (formato === "JSON") {
                generarJSON();
            }
        }

function generarCSV() {
            let salida = "matricula,primer_apellido,segundo_apellido,nombre,fecha_nacimiento,correo\n";
            let cantidad = parseInt(document.getElementById("cantidad").value);

            if(cantidad < 1 || cantidad > 50000) {
                alert("La cantidad debe estar entre 1 y 50,000.");
                return;
            }

            for (let i = 0; i < cantidad; i++) {
                const matricula = 23311200 + i;
                const primerApellido = apellidosAlemanes[i % apellidosAlemanes.length];
                const segundoApellido = apellidosEspanoles[i % apellidosEspanoles.length];
                const nombre = nombresChinos[i % nombresChinos.length];
                const fechaNacimiento = generarFecha();
                const correo = `${matricula}@unikino.edu.mx`;
                salida += `${matricula},${primerApellido},${segundoApellido},${nombre},${fechaNacimiento},${correo}\n`;
            }
            document.getElementById("resultado").textContent = salida;
        }

        function generarJSON() {
            let alumnos = [];
            let cantidad = parseInt(document.getElementById("cantidad").value);

            if(cantidad < 1 || cantidad > 50000) {
                alert("La cantidad debe estar entre 1 y 50,000.");
                return;
            }

            for (let i = 0; i < cantidad; i++) {
                const matricula = 23311200 + i;
                const primerApellido = apellidosAlemanes[i % apellidosAlemanes.length];
                const segundoApellido = apellidosEspanoles[i % apellidosEspanoles.length];
                const nombre = nombresChinos[i % nombresChinos.length];
                const fechaNacimiento = generarFecha();
                const correo = `${matricula}@unikino.edu.mx`;
                alumnos.push({
                    matricula: matricula,
                    primerApellido: primerApellido,
                    segundoApellido: segundoApellido,
                    nombre: nombre,
                    fechaNacimiento: fechaNacimiento,
                    correo: correo
                });
            }
            document.getElementById("resultado").textContent = JSON.stringify(alumnos, null, 2);
        }

        function guardarFormato() {
